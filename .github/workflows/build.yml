name: Build curl with c-ares

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: debian:trixie

    env:
      APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
      APT_GPG_KEY_ID: ${{ secrets.APT_GPG_KEY_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build repository
        run: bash scripts/build.sh

      - name: Verify repository
        run: |
          test -s /repo/Packages.gz
          test -s /repo/Release
          test -s /repo/InRelease
          test -s /repo/Release.gpg
          test -s /repo/curl-cares-debian.asc
          ls -lh /repo

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: /repo

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy repository
        id: deployment
        uses: actions/deploy-pages@v5
